    <section class="bienvenida">
        <img src="pagina.escuela/inicio2.webp" alt="Imagen bienvenida">
        <h2>¡Bienvenidos a Nuestra Tienda! 🛒</h2>
    </section>

    <div class="container">
        <h1>Tienda Online</h1>
        
        <div class="productos">
            <div class="producto">
                <img src="https://via.placeholder.com/150" alt="Producto 1">
                <h3>Producto 1</h3>
                <p class="precio">$99.99</p>
                <button class="btn-agregar" onclick="agregarAlCarrito(1, 'Producto 1', 99.99)">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="./pagina.escuela/hola.jpeg" alt="Producto 2">
                <h3>Producto 2</h3>
                <p class="precio">$149.99</p>
                <button class="btn-agregar" onclick="agregarAlCarrito(2, 'Producto 2', 149.99)">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="https://via.placeholder.com/150" alt="Producto 3">
                <h3>Producto 3</h3>
                <p class="precio">$199.99</p>
                <button class="btn-agregar" onclick="agregarAlCarrito(3, 'Producto 3', 199.99)">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="https://via.placeholder.com/150" alt="Producto 4">
                <h3>Producto 4</h3>
                <p class="precio">$199.99</p>
                <button class="btn-agregar" onclick="agregarAlCarrito(4, 'Producto 4', 199.99)">Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="https://via.placeholder.com/150" alt="Producto 5">
                <h3>Producto 5</h3>
                <p class="precio">$199.99</p>
                <button class="btn-agregar" onclick="agregarAlCarrito(5, 'Producto 5', 199.19)">Agregar al carrito</button>
            </div>
        </div>

        <div class="carrito">
            <h2>Carrito de Compras</h2>
            <div id="carrito-items"></div>
            <div class="carrito-total">
                Total: $<span id="total">0.00</span>
            </div>
            <button id="btn-comprar" class="btn-comprar" onclick="procederCompra()">Proceder a la Compra</button>
        </div>
    </div>

    <script src="/js/carrito.js"></script>
