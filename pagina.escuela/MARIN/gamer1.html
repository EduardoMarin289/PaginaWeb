<script>
    const canvas = document.getElementById("snake");
    const ctx = canvas.getContext("2d");
    const box = 20;

    let snake = [];
    let food = {};
    let direction;
    let gameInterval;
    let score = 0;
    const scoreDisplay = document.getElementById("scoreDisplay");

    document.getElementById("startBtn").addEventListener("click", iniciarJuego);

    document.addEventListener("keydown", changeDirection);

    function changeDirection(event) {
        const key = event.keyCode;
        if ((key === 37 || key === 65) && direction !== "RIGHT") direction = "LEFT";  
        else if ((key === 38 || key === 87) && direction !== "DOWN") direction = "UP"; 
        else if ((key === 39 || key === 68) && direction !== "LEFT") direction = "RIGHT"; 
        else if ((key === 40 || key === 83) && direction !== "UP") direction = "DOWN"; 
    }

    function crearComida() {
        food = {
            x: Math.floor(Math.random() * (canvas.width / box)) * box,
            y: Math.floor(Math.random() * (canvas.height / box)) * box,
        };
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === food.x && snake[i].y === food.y) {
                crearComida();
            }
        }
    }

    function iniciarJuego() {
        clearInterval(gameInterval);
        snake = [];
        score = 0;
        scoreDisplay.textContent = "Puntaje: 0";
        direction = undefined;
        for (let i = 2; i >= 0; i--) {
            snake.push({ x: i * box, y: 0 });
        }
        crearComida();
        gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
        if (!direction) return; // no iniciar sin dirección

        // Mover serpiente
        let headX = snake[0].x;
        let headY = snake[0].y;

        if (direction === "LEFT") headX -= box;
        else if (direction === "UP") headY -= box;
        else if (direction === "RIGHT") headX += box;
        else if (direction === "DOWN") headY += box;

        // Colisiones con pared
        if (headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height) {
            clearInterval(gameInterval);
            alert("¡Perdiste! Tu puntaje fue: " + score);
            return;
        }

        // Colisiones con sí misma
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === headX && snake[i].y === headY) {
                clearInterval(gameInterval);
                alert("¡Perdiste! Tu puntaje fue: " + score);
                return;
            }
        }

        // Mover cuerpo
        snake.unshift({ x: headX, y: headY });

        // Comer comida
        if (headX === food.x && headY === food.y) {
            score++;
            scoreDisplay.textContent = "Puntaje: " + score;
            crearComida();
        } else {
            snake.pop();
        }

        // Dibujar todo
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#39ff14";
        for (let i = 0; i < snake.length; i++) {
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
        }

        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, box, box);
    }
</script>
