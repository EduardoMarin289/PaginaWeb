<body>
    <header>

                <li><a href="/pagina.escuela/inicio.html">Home</a></li>

            </ul>
        </nav>
    </header>

    <div class="formulario-container">
        <h2>Formulario de Compra</h2>
        
        <div class="resumen-compra">
            <h3>Resumen de Compra</h3>
            <div id="resumen-items"></div>
            <p>Total: $<span id="resumen-total">0.00</span></p>
        </div>

        <form id="formulario-compra" onsubmit="return validarFormulario(event)">
            <div class="formulario-grupo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="formulario-grupo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="formulario-grupo">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="formulario-grupo">
                <label for="direccion">Dirección de Envío:</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>

            <div class="formulario-grupo">
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" required>
            </div>

            <div class="formulario-grupo">
                <label for="codigo-postal">Código Postal:</label>
                <input type="text" id="codigo-postal" name="codigo-postal" required>
            </div>

            <div class="formulario-grupo">
                <label for="metodo-pago">Método de Pago:</label>
                <select id="metodo-pago" name="metodo-pago" required>
                    <option value="">Seleccione un método de pago</option>
                    <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                    <option value="transferencia">Transferencia Bancaria</option>
                    <option value="efectivo">Efectivo</option>
                </select>
            </div>

            <button type="submit" class="btn-enviar">Confirmar Compra</button>
        </form>
    </div>mmmmm

    <script src="/js/carrito.js"></script>
</body>
</html>
